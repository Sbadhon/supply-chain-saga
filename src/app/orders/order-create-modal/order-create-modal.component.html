<div *ngIf="open" class="modal d-block" tabindex="0" (click)="onBackdrop()">
  <div
    class="modal-dialog modal-lg modal-dialog-centered"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title m-0">Create Order</h6>
        <button
          type="button"
          class="btn-close"
          aria-label="Close"
          (click)="close()"
        ></button>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="modal-body">
          <div class="row g-2 align-items-end mb-2">
            <div class="col-12 col-md-6">
              <label class="form-label small mb-1" for="customerId"
                >Customer ID (optional)</label
              >
              <input
                id="customerId"
                class="form-control form-control-sm"
                formControlName="customerId"
                autocomplete="off"
                placeholder="e.g. CUST-123"
              />
            </div>

            <div class="col-6 col-md-3">
              <label class="form-label small mb-1">Items Count</label>
              <input
                class="form-control form-control-sm"
                [value]="itemsCount()"
                readonly
              />
            </div>

            <div class="col-6 col-md-3">
              <label class="form-label small mb-1">Order Total</label>
              <input
                class="form-control form-control-sm"
                [value]="total()"
                readonly
              />
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label m-0 small">Items</label>
            <button
              type="button"
              class="btn btn-sm btn-outline-primary"
              (click)="addItem()"
            >
              + Add item
            </button>
          </div>

          <div class="table-responsive border rounded">
            <table class="table table-sm align-middle m-0">
              <thead class="table-light">
                <tr>
                  <th style="min-width: 110px">SKU</th>
                  <th style="width: 110px">Supplier</th>
                  <th style="width: 110px" class="text-end">Qty</th>
                  <th style="width: 140px" class="text-end">Unit Price</th>
                  <th style="width: 140px" class="text-end">Line Total</th>
                  <th style="width: 36px"></th>
                </tr>
              </thead>
              <tbody formArrayName="items">
                <tr
                  *ngFor="let grp of items.controls; let i = index"
                  [formGroupName]="i"
                >
                  <td>
                    <input
                      class="form-control form-control-sm"
                      placeholder="SKU-1"
                      formControlName="sku"
                    />
                    <div
                      class="text-danger small"
                      *ngIf="submitted() && grp.get('sku')?.invalid"
                    >
                      SKU is required.
                    </div>
                  </td>
                  <td>
                    <input
                      class="form-control form-control-sm"
                      placeholder="SUP-A"
                      formControlName="supplierId"
                    />
                    <div
                      class="text-danger small"
                      *ngIf="submitted() && grp.get('supplierId')?.invalid"
                    >
                      Supplier is required.
                    </div>
                  </td>
                  <td class="text-end">
                    <input
                      class="form-control form-control-sm text-end"
                      type="number"
                      min="1"
                      step="1"
                      formControlName="quantity"
                      (keydown.enter)="focusNext(i, 'unitPrice')"
                    />
                    <div
                      class="text-danger small"
                      *ngIf="submitted() && grp.get('quantity')?.invalid"
                    >
                      Min 1.
                    </div>
                  </td>
                  <td class="text-end">
                    <input
                      class="form-control form-control-sm text-end"
                      type="number"
                      min="0"
                      step="0.01"
                      formControlName="unitPrice"
                      #unitPrice
                      (keydown.enter)="
                        i === items.length - 1 ? addItem() : focusRow(i + 1)
                      "
                    />
                    <div
                      class="text-danger small"
                      *ngIf="submitted() && grp.get('unitPrice')?.invalid"
                    >
                      Must be ≥ 0.
                    </div>
                  </td>
                  <td class="text-end">
                    <input
                      class="form-control form-control-sm text-end"
                      [value]="lineTotalFor(i) | number: '1.2-2'"
                      readonly
                    />
                  </td>
                  <td class="text-center">
                    <button
                      type="button"
                      class="btn btn-sm btn-outline-danger"
                      (click)="removeItem(i)"
                      aria-label="Remove item"
                    >
                      &times;
                    </button>
                  </td>
                </tr>

                <tr *ngIf="items.length === 0">
                  <td colspan="6" class="text-center text-muted small py-3">
                    No items yet. Click <strong>+ Add item</strong> to begin.
                  </td>
                </tr>
              </tbody>
              <tfoot *ngIf="items.length">
                <tr class="table-light">
                  <th colspan="4" class="text-end">Total</th>
                  <th class="text-end">{{ total() | number: "1.2-2" }}</th>
                  <th></th>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>

        <div class="modal-footer py-2">
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            (click)="close()"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="btn btn-sm btn-primary"
            [disabled]="form.invalid || items.length === 0"
          >
            Create
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Backdrop -->
<div *ngIf="open" class="modal-backdrop fade show"></div>
