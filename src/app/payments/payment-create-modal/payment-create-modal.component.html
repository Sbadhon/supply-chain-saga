<div *ngIf="open" class="modal d-block" tabindex="0" (click)="onBackdrop()">
    <div class="modal-dialog modal-sm modal-dialog-centered" (click)="$event.stopPropagation()">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h6 class="modal-title m-0">Create Payment</h6>
          <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
        </div>
  
        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="modal-body">
            <div class="mb-2">
              <label class="form-label small mb-1" for="orderId">Order ID</label>
              <input id="orderId"
                     class="form-control form-control-sm"
                     formControlName="orderId"
                     autocomplete="off"
                     placeholder="ORD-123"/>
              <div class="text-danger small mt-1" *ngIf="submitted() && form.get('orderId')?.invalid">
                Order ID is required.
              </div>
            </div>
  
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small mb-1" for="amount">Amount</label>
                <input id="amount" type="number" step="0.01" min="0"
                       class="form-control form-control-sm"
                       formControlName="amount"/>
                <div class="text-danger small mt-1" *ngIf="submitted() && form.get('amount')?.invalid">
                  Enter a non-negative amount.
                </div>
              </div>
              <div class="col-6">
                <label class="form-label small mb-1" for="currency">Currency</label>
                <input id="currency"
                       class="form-control form-control-sm"
                       formControlName="currency"
                       autocomplete="off"
                       placeholder="USD"/>
                <div class="text-danger small mt-1" *ngIf="submitted() && form.get('currency')?.invalid">
                  Currency is required (e.g., USD).
                </div>
              </div>
            </div>
  
            <div>
              <label class="form-label small mb-1" for="method">Method (optional)</label>
              <input id="method"
                     class="form-control form-control-sm"
                     formControlName="method"
                     autocomplete="off"
                     placeholder="card | ach | ..."/>
            </div>
          </div>
  
          <div class="modal-footer py-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" (click)="close()">Cancel</button>
            <button type="submit" class="btn btn-sm btn-primary" [disabled]="form.invalid">Create</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <!-- Backdrop -->
  <div *ngIf="open" class="modal-backdrop fade show"></div>
